[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lvl-toolkit"
version = "0.1.0"
description = "Load and process Level capture files (IMU, gait, and related session data) from Python."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lvl-vicon-merge = "lvl_toolkit.vicon.merge:main"
lvl-vicon-bridge = "lvl_toolkit.vicon.bridge:main"
lvl-vicon-pull = "lvl_toolkit.vicon.pull_imu:main"
lvl-vicon-clocksync = "lvl_toolkit.vicon.clock_sync:main"

[project.urls]
Repository = "https://github.com/lvlmotion/lvl-toolkit"

[tool.setuptools.packages.find]
include = ["lvl_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Conda environment for lvl-toolkit development.
#
#   conda env create -f environment.yml
#   conda activate lvl-toolkit
#
# Mirrors the runtime deps in pyproject.toml (numpy, pandas) plus pytest for the
# test suite and matplotlib for building a plotting layer on top of the loader.
# The final pip line installs lvl-toolkit itself in editable mode.
name: lvl-toolkit
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.21
  - pandas>=1.3
  - pytest>=7.0
  - matplotlib>=3.5
  - pip
  - pip:
      - -e .
